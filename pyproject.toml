[project]
name = "phishguard"
version = "0.1.0"
description = "Leakage-aware phishing URL detection with reproducible data pipelines, rigorous evaluation, CI/CD, and production deployment."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Chetana Vijayakumar" }
]
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "scikit-learn>=1.5",
  "tldextract>=5.1",
  "ucimlrepo>=0.0.7",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phishguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["phishguard"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
